[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-scorer"
version = "0.1.0"
description = "Six-dimension weighted composite vulnerability scoring for SBOMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.0",
    "pyyaml>=6.0",
    "cyclonedx-python-lib>=7.0",
    "spdx-tools>=0.8",
    "requests>=2.31",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pyvis>=0.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sbom-scorer = "sbom_scorer.cli:main"

[tool.setuptools.packages.find]
include = ["sbom_scorer*"]
